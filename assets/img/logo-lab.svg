  <circle cx="20" cy="18" r="2.5" fill="#f87171" />
  <circle cx="27" cy="18" r="2.5" fill="#fbbf24" />
  <circle cx="34" cy="18" r="2.5" fill="#4ade80" />
  <!-- Code brackets / Coffee steam in window -->
