  <path d="M 42 34 L 36 28 L 42 22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Brand Text -->
  <text x="64" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#1e293b" class="logo-text-title">MODUL 3 GUI</text>
  <text x="64" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#f59e0b" letter-spacing="1">JAVA SWING • PBO</text>
